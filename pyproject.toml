[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnsd-webui"
version = "0.1.0"
description = "A small web interface for a running Reticulum daemon (rnsd): interfaces, paths, announces and a few tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4", "rns>=1.5.7,<2"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[project.scripts]
rnsd-webui = "rnsd_webui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnsd_webui = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the rns package and starts a real rnsd"]
